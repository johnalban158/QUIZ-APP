# Render Blueprint — static site for the Quiz App marketing / landing page.
#
# Optional: you can deploy this page via Render "Blueprints" (Infrastructure as Code)
# instead of the manual dashboard flow. Either way works — the dashboard flow is
# documented in README.md and needs zero config.
#
# Usage: in the Render dashboard choose New -> Blueprint and link this repo.
# Render reads this file (marketing/render.yaml) and creates the static site.
services:
  - type: web
    name: quiz-app-marketing
    runtime: static
    buildCommand: echo "No build step needed — pure HTML/CSS/JS"
    staticPublishPath: ./marketing
    previews:
      generation: automatic