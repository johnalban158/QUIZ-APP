# Render Blueprint — deploys the full Quiz App (frontend + backend + database)
# Used by Render dashboard: New → Blueprint → connect this repo.
# This file MUST live at the repo root for Render to find it.

services:
  # 1. Frontend — React/Vite static site
  - type: web
    name: quiz-app-frontend
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://quiz-app-backend.onrender.com
      # Permanent APK download link (set AFTER you publish a GitHub Release
      # asset). Leave empty to fall back to the API's /uploads/ folder.
      - key: VITE_APK_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    previews:
      generation: automatic

  # 2. Backend — Express API (Node.js)
  - type: web
    name: quiz-app-backend
    runtime: node
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npx prisma db push
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-app-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://quiz-app-frontend.onrender.com
      # Extra comma-separated origins for CORS (same value is fine).
      - key: CORS_ORIGINS
        value: https://quiz-app-frontend.onrender.com
      # Question audio/video uploads (free Cloudinary account). Media
      # uploads fail without these; everything else still works.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Bug-report emails (optional). Without these, reports are still
      # saved and visible at /admin/reports — just not emailed.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_TO
        sync: false
      - key: MAIL_FROM
        sync: false
    healthCheckPath: /api/health
    previews:
      generation: automatic

databases:
  - name: quiz-app-db
    plan: free
    databaseName: quizapp
    user: quizapp